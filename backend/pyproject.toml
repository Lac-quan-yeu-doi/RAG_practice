[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-project"
version = "0.1.0"
description = "Modular RAG over text documentation of Python 3.14"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb",
    "numpy",
    "python-dotenv",
    "requests",
    "sentence-transformers"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
