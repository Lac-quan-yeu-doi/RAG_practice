services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ./installations/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${LLM_MODEL:-qwen3:1.7b}
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama pull "$${OLLAMA_MODEL}"
    volumes:
      - ./installations/ollama:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      WEB_DATA_ROOT: /app/web_data
      RAG_BASE_CONFIG: /app/configs/sources.json
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_UNCOMPRESSED_MB: ${MAX_UNCOMPRESSED_MB:-200}
      MAX_TEXT_FILES: ${MAX_TEXT_FILES:-2000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_API_KEY: ollama
      LLM_MODEL: ${LLM_MODEL:-qwen3:1.7b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
    volumes:
      - ./storage:/app/web_data
      - ./installations/huggingface-cache:/root/.cache
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped


    